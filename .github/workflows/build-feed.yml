name: Build Nieuwsquiz podcast feed

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build feed
        env:
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
        run: python build_feed.py

      - name: Commit changes
        run: |
          git config user.name "nieuwsquiz-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml docs/state.json
          git diff --cached --quiet || git commit -m "Update Nieuwsquiz feed"
          git push
